<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>น้องของฉัน — PurrPetCare</title>
  <link rel="icon" type="image/png" href="/assets/pets/purrpetcare-logo-mark.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap page-shell">
    <header class="page-head">
      <div><span class="eyebrow">My pets</span><h1>น้องของฉัน</h1><p class="muted">เก็บข้อมูลสำคัญของน้องไว้ในที่เดียว เพื่อให้ทุกบริการเหมาะกับเขามากที่สุด</p></div>
      <a class="btn" href="#addPet">+ เพิ่มน้อง</a>
    </header>
    <div class="split">
      <section aria-labelledby="petListTitle">
        <h2 id="petListTitle" class="sr-only">รายชื่อน้อง</h2>
        <div class="pet-grid" id="petList" aria-live="polite"><div class="card loading-state"><div class="spinner"></div></div></div>
      </section>

      <aside class="card sticky add-pet-card" id="addPet">
        <span class="eyebrow">New profile</span><h2 style="font-size:2rem">เพิ่มน้องใหม่</h2>
        <p class="muted small">ข้อมูลน้ำหนักจะใช้เลือกขนาดห้องและคำนวณราคากรูมมิ่งอัตโนมัติ</p>
        <form id="petForm">
          <div class="field"><label for="petName">ชื่อน้อง *</label><input id="petName" name="petName" autocomplete="off" required></div>
          <div class="grid g2" style="gap:12px">
            <div class="field"><label for="species">ชนิด *</label><select id="species" name="species"><option value="Dog">สุนัข</option><option value="Cat">แมว</option></select></div>
            <div class="field"><label for="gender">เพศ</label><select id="gender" name="gender"><option value="">ไม่ระบุ</option><option value="M">ผู้</option><option value="F">เมีย</option></select></div>
          </div>
          <div class="field"><label for="breed">สายพันธุ์</label><input id="breed" name="breed"></div>
          <div class="grid g2" style="gap:12px">
            <div class="field"><label for="weightKg">น้ำหนัก (kg) *</label><input id="weightKg" name="weightKg" type="number" step="0.1" min="0.1" max="100" required></div>
            <div class="field"><label for="birthDate">วันเกิด</label><input id="birthDate" name="birthDate" type="date"></div>
          </div>
          <div class="field"><label for="medicalNotes">ข้อควรระวัง / โรคประจำตัว</label><textarea id="medicalNotes" name="medicalNotes" rows="3" placeholder="เช่น แพ้อาหารทะเล หรือขี้ตกใจ"></textarea></div>
          <div class="field"><label for="photoURL">ลิงก์รูปน้อง (ถ้ามี)</label><input id="photoURL" name="photoURL" type="url" placeholder="https://..."><div class="field-help">หากไม่ใส่ ระบบจะแสดงภาพสัญลักษณ์แทน</div></div>
          <button class="block" type="submit">บันทึกโปรไฟล์น้อง</button>
        </form>
      </aside>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script>
    const SIZE_TH = { S: 'ไซซ์ S', M: 'ไซซ์ M', L: 'ไซซ์ L' };
    async function loadPets() {
      const box = document.getElementById('petList');
      box.innerHTML = '<div class="card loading-state"><div class="spinner"></div></div>';
      try {
        const pets = await api('/api/pets');
        if (!pets.length) {
          box.innerHTML = `<div class="card empty" style="grid-column:1/-1"><div class="icon-box">${icon('care')}</div><h3>ยังไม่มีโปรไฟล์น้อง</h3><p>เพิ่มเพื่อนตัวโปรดคนแรก แล้วเริ่มเลือกบริการที่เหมาะกับเขาได้เลย</p><a class="btn" href="#addPet">เพิ่มน้องคนแรก</a></div>`;
          return;
        }
        box.innerHTML = pets.map((p) => `<article class="card pet-card card-hover">
          <div class="pet">${petProfileImage(p, 'card')}
          <div><span class="eyebrow" style="margin-bottom:5px">${p.Species === 'Cat' ? 'Cat profile' : 'Dog profile'}</span><h2 style="font-size:2rem;margin-bottom:4px">${esc(p.PetName)}</h2><div class="muted small">${esc(p.Breed || (p.Species === 'Cat' ? 'แมว' : 'สุนัข'))}</div></div></div>
          <div class="pet-meta"><span>น้ำหนัก<b>${Number(p.WeightKg)} kg</b></span><span>ขนาดตัว<b>${SIZE_TH[p.WeightClass]}</b></span><span>เพศ<b>${p.Gender ? (p.Gender === 'M' ? 'ผู้' : 'เมีย') : 'ไม่ระบุ'}</b></span><span>วันเกิด<b>${p.BirthDate ? thDate(p.BirthDate) : 'ไม่ระบุ'}</b></span></div>
          ${p.MedicalNotes ? `<div class="note">${icon('care')} ${esc(p.MedicalNotes)}</div>` : ''}
          <div class="row" style="margin-top:16px"><a class="btn block" href="book.html?pet=${p.PetID}">จองบริการให้${esc(p.PetName)}</a></div>
        </article>`).join('');
      } catch (e) { box.innerHTML = errorHtml(e.message); throw e; }
    }

    (async () => { await requireCustomer('pets.html'); await loadPets(); })().catch((e) => { if (e.message !== 'not logged in') toast(e.message, 'error'); });
    document.getElementById('petForm').onsubmit = async (e) => {
      e.preventDefault(); const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
      try {
        await api('/api/pets', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) });
        e.target.reset(); toast('เพิ่มโปรไฟล์น้องเรียบร้อย', 'ok'); await loadPets(); window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) { toast(err.message, 'error'); } finally { btn.disabled = false; }
    };
  </script>
</body>
</html>
