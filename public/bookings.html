<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ติดตามสถานะ — PurrPetCare</title>
  <link rel="icon" type="image/png" href="/assets/pets/purrpetcare-logo-mark.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap page-shell">
    <header class="page-head">
      <div><span class="eyebrow">Care journey</span><h1>ติดตามน้องของคุณ</h1><p class="muted">สถานะด้านล่างอัปเดตจากข้อมูลการจอง บริการ และการปฏิบัติงานจริงในระบบ</p></div>
      <div class="refresh-box"><span class="live-status"><span class="live-dot" aria-hidden="true"></span><span>อัปเดตล่าสุด <b id="lastUpdated">—</b></span></span><button class="refresh-btn" id="refresh" type="button" title="รีเฟรชสถานะ"><span class="refresh-ring" id="refreshRing"><span id="refreshIcon"></span></span><span>รีเฟรช</span></button></div>
    </header>
    <div class="db-proof hidden" style="margin:0 0 26px"><span id="liveDbIcon"></span><span>อัปเดตอัตโนมัติทุก 20 วินาที • ข้อมูลจาก booking.vw_BookingSummary, grooming.vw_GroomingSchedule และ booking.vw_BookingExtras</span></div>
    <div id="list" aria-live="polite"><div class="card loading-state"><div class="spinner"></div></div></div>
  </main>

  <script src="js/common.js"></script>
  <script>
    document.getElementById('refreshIcon').innerHTML = icon('refresh');
    document.getElementById('liveDbIcon').innerHTML = icon('database');
    async function load() {
      const box = document.getElementById('list');
      // Keep the current list on screen during a refresh; only show the spinner on the first load
      if (!box.querySelector('.booking-record')) box.innerHTML = '<div class="card loading-state"><div class="spinner"></div></div>';
      try {
        const list = await api('/api/bookings', { cache: 'no-store' });
        if (!list.length) { box.innerHTML = `<div class="card empty"><div class="icon-box">${icon('calendar')}</div><h3>ยังไม่มีการจอง</h3><p>เมื่อจองบริการแล้ว คุณจะติดตามทุกขั้นตอนได้จากหน้านี้</p><a class="btn btn-arrow" href="book.html">จองบริการให้น้อง</a></div>`; return; }
        const item = (art, title, sub, end = '') => `<div class="booking-item">${serviceArtBox(art)}<div class="booking-item-copy"><b>${title}</b>${sub ? `<span class="muted small">${sub}</span>` : ''}</div>${end}</div>`;
        box.innerHTML = list.map((b) => { const due = Number(b.TotalPrice || 0) - Number(b.PaidAmount || 0); return `<article class="card booking-record st-${esc(b.Status)}">
          <header class="booking-record-header">${petProfileImage(b, 'booking')}<div class="booking-record-copy"><span class="eyebrow">Booking ${esc(b.BookingNo)}</span><h2>${esc(b.PetName)}</h2><div class="muted small">จองเมื่อ ${thDate(b.BookingDate)}</div></div>${badge(b.Status)}</header>
          ${trackerHtml(b, false, true)}
          <div class="booking-detail">
            <div class="booking-items">
              <span class="detail-label">รายละเอียดการดูแล</span>
              ${b.RoomNo ? item('hotel', `ห้อง ${esc(b.RoomNo)}`, `${b.Nights} คืน · ${thDate(b.CheckInDate)} – ${thDate(b.CheckOutDate)}`) : ''}
              ${b.grooming.map((g) => item(g.ServiceName, esc(g.ServiceName), `${esc(g.StaffName)} · ${thDate(g.StartTime)}`, badge(g.Status))).join('')}
              ${b.extras.map((x) => item(x.ExtraName, `${esc(x.ExtraName)} × ${x.Qty} ${esc(x.Unit)}`, '', badge(x.Status))).join('')}
              ${b.Note ? `<div class="note">หมายเหตุ: ${esc(b.Note)}</div>` : ''}
            </div>
            <div class="booking-pay">
              <span class="detail-label">การชำระเงิน</span>
              <div class="pay-total"><span>ยอดรวม</span><strong>${baht(b.TotalPrice)}</strong></div>
              <div class="summary-line"><span>ชำระแล้ว</span><span>${baht(b.PaidAmount)}</span></div>
              ${b.Status === 'Cancelled' ? '' : due > 0 ? `<div class="pay-state pay-due">ค้างชำระ <b>${baht(due)}</b></div>` : '<div class="pay-state pay-ok">✓ ชำระครบแล้ว</div>'}
              ${b.Status === 'Confirmed' ? `<button class="danger sm block" data-cancel="${b.BookingID}" style="margin-top:12px">ยกเลิกการจอง</button>` : ''}
            </div>
          </div>
        </article>`; }).join('');
        box.querySelectorAll('[data-cancel]').forEach((el) => (el.onclick = async () => {
          if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'กดอีกครั้งเพื่อยืนยัน'; return; }
          el.disabled = true;
          try { await api(`/api/bookings/${el.dataset.cancel}/cancel`,{ method:'POST' }); toast('ยกเลิกการจองแล้ว','ok'); load(); }
          catch (e) { el.disabled = false; toast(e.message,'error'); }
        }));
      } catch (e) { box.innerHTML = errorHtml(e.message); throw e; }
    }
    // Auto-refresh every 20s; the ring around the refresh icon fills up as the next refresh approaches
    const REFRESH_MS = 20000, refreshBtn = document.getElementById('refresh'), ring = document.getElementById('refreshRing');
    let nextRefresh = Infinity;
    async function refreshNow() {
      nextRefresh = Infinity; refreshBtn.classList.add('spinning'); refreshBtn.disabled = true;
      try { await load(); document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' น.'; }
      finally { refreshBtn.classList.remove('spinning'); refreshBtn.disabled = false; nextRefresh = Date.now() + REFRESH_MS; }
    }
    setInterval(() => {
      const left = nextRefresh - Date.now();
      ring.style.setProperty('--p', Number.isFinite(left) ? Math.min(1, Math.max(0, 1 - left / REFRESH_MS)) : 0);
      if (left <= 0) refreshNow().catch(() => {});
    }, 200);
    (async () => { await requireCustomer('bookings.html'); await refreshNow(); })().catch((e) => { if (e.message !== 'not logged in') toast(e.message,'error'); });
    refreshBtn.onclick = () => refreshNow().catch((e) => toast(e.message,'error'));
  </script>
</body>
</html>
